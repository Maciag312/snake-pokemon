<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Snake Pokemon</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 70%, #050509 100%);
      color: #eee;
      font: 14px monospace;
      padding: 8px;
      transition: background 0.4s ease;
    }
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 832px);
      max-width: 100%;
    }
    #wrap {
      position: relative;
      width: 100%;
      padding: clamp(8px, 2vw, 16px);
      background: rgba(20, 16, 28, 0.6);
      box-shadow:
        0 0 40px rgba(120, 80, 180, 0.1),
        0 10px 28px rgba(0, 0, 0, 0.45);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }
    #wrap::before,
    #wrap::after {
      display: none;
    }
    canvas {
      background: #000;
      image-rendering: pixelated;
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      border: none;
      border-radius: 4px;
    }
    .bar {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }
    .stat {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 10px;
      border: 1px solid #5a4a6a;
      border-radius: 4px;
    }
    .slots {
      display: inline-flex;
      gap: 4px;
    }
    .slot {
      width: 22px;
      height: 22px;
      opacity: 0.28;
      filter: grayscale(1);
      transition: opacity 0.2s, filter 0.2s, transform 0.2s;
    }
    .slot.on {
      opacity: 1;
      filter: none;
    }
    .slot.pop {
      animation: pop 0.35s ease;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    #menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(10, 8, 14, 0.95);
      text-align: center;
      gap: 12px;
      z-index: 3;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    #menu.hidden { display: none; }
    .menu-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      max-width: 300px;
    }
    select, button, input {
      background: #2a2438;
      color: #eee;
      border: 1px solid #5a4a6a;
      font: inherit;
      padding: 6px 10px;
      max-width: 100%;
      border-radius: 4px;
      width: 100%;
    }
    input { text-align: center; }
    button { cursor: pointer; font-weight: bold; background: #3a3450; }
    button:hover { background: #4a4460; }
    #hint { opacity: 0.7; font-size: 12px; margin-top: 6px; max-width: 28ch; margin-inline: auto; }
    
    #leaderboard {
      width: 100%;
      background: rgba(10, 8, 14, 0.95);
      border: 1px solid #5a4a6a;
      border-radius: 8px;
      padding: 12px;
      margin-top: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-height: 280px;
      overflow-y: auto;
      box-sizing: border-box;
    }
    #leaderboard h3 { font-size: 14px; margin-bottom: 6px; color: #a89fbe; border-bottom: 1px solid #333; padding-bottom: 4px;}
    #leaderboardList { list-style: none; padding: 0; margin: 0; font-size: 12px; }
    #leaderboardList li { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    #leaderboardList li:last-child { border-bottom: none; }
    .lb-user { font-weight: bold; color: #fff; }
    .lb-score { color: #5dade2; font-weight: bold; margin-left: 6px; }
    .lb-meta { display: flex; gap: 4px; align-items: center; }
    .lb-icon { width: 20px; height: 20px; image-rendering: pixelated; border-radius: 2px; }

    .char-selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
      margin-bottom: 8px;
    }
    .char-option {
      background: #2a2438;
      border: 1px solid #5a4a6a;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
      justify-content: flex-start;
      color: #eee;
      width: 100%;
    }
    .char-option:hover {
      background: #352d47;
      border-color: #7b629c;
    }
    .char-option.active {
      background: #413758;
      border-color: #a88be6;
      box-shadow: 0 0 10px rgba(168, 139, 230, 0.4);
    }
    .char-head {
      width: 20px;
      height: 20px;
      image-rendering: pixelated;
      border-radius: 2px;
      flex-shrink: 0;
      background: rgba(0,0,0,0.25);
    }
    .hidden {
      display: none !important;
    }

    #podiumContainer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      margin-top: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      width: 100%;
    }
    .podium-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80px;
      flex-shrink: 0;
    }
    .podium-char canvas {
      width: 20px;
      height: 20px;
      image-rendering: pixelated;
      border-radius: 2px;
      display: block;
      margin-bottom: 4px;
      background: rgba(0,0,0,0.25);
    }
    .podium-user {
      font-weight: bold;
      font-size: 11px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80px;
      text-align: center;
      margin-bottom: 1px;
    }
    .podium-score {
      font-size: 11px;
      font-weight: bold;
      color: #5dade2;
      margin-bottom: 4px;
    }
    .podium-block {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 16px;
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
    }
    .step-first .podium-block {
      height: 52px;
      background: linear-gradient(180deg, #f1c40f 0%, #d4ac0d 100%);
      box-shadow: 0 0 12px rgba(241, 196, 15, 0.35);
      color: #000;
    }
    .step-second .podium-block {
      height: 38px;
      background: linear-gradient(180deg, #bdc3c7 0%, #95a5a6 100%);
      color: #000;
    }
    .step-third .podium-block {
      height: 26px;
      background: linear-gradient(180deg, #cd7f32 0%, #b87333 100%);
      color: #000;
    }
    .step-first .podium-user {
      color: #f1c40f;
      font-size: 12px;
    }

    .diff-selector {
      margin-top: 16px;
      margin-bottom: 20px;
      width: 100%;
    }
    .diff-options {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .diff-option {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px;
      color: #eee;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s ease;
    }
    .diff-option:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .diff-option.active {
      background: rgba(52, 152, 219, 0.15);
      border-color: #3498db;
      box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
      color: #fff;
    }
    .diff-option.active[data-diff="easy"] {
      background: rgba(46, 204, 113, 0.15);
      border-color: #2ecc71;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
    }
    .diff-option.active[data-diff="hard"] {
      background: rgba(231, 76, 60, 0.15);
      border-color: #e74c3c;
      box-shadow: 0 0 10px rgba(231, 76, 60, 0.3);
    }
    .diff-name {
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 2px;
    }
    .diff-desc {
      font-size: 9px;
      opacity: 0.7;
      text-align: center;
    }

    @media (max-width: 600px) {
      .bar {
        margin-top: 32px;
        margin-bottom: 16px;
      }
      .menu-group, #leaderboard {
        max-width: 100% !important;
        width: 100% !important;
      }
      #menu {
        padding: 8px !important;
        gap: 8px !important;
      }
      .diff-option {
        padding: 6px 2px !important;
      }
      .diff-name {
        font-size: 10px !important;
      }
      .diff-desc {
        font-size: 7.5px !important;
      }
      #leaderboard {
        max-height: 160px !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="menu">
        <div class="menu-group">
          <label for="usernameInput" style="font-size: 12px; color: #a89fbe;">Twoja nazwa (zapisywana automatycznie)</label>
          <input type="text" id="usernameInput" maxlength="15" placeholder="Wpisz nazwę" />
        </div>
        
        <div class="menu-group">
          <label style="font-size: 12px; color: #a89fbe; margin-bottom: 6px;">Wybierz Pokemona</label>
          <div class="char-selector" id="charSelector">
            <button type="button" class="char-option active" data-pokemon="pikachu">
              <canvas class="char-head" width="20" height="20"></canvas>
              <span>Pikachu</span>
            </button>
            <button type="button" class="char-option" data-pokemon="bulbasaur">
              <canvas class="char-head" width="20" height="20"></canvas>
              <span>Bulbasaur</span>
            </button>
            <button type="button" class="char-option" data-pokemon="charmander">
              <canvas class="char-head" width="20" height="20"></canvas>
              <span>Charmander</span>
            </button>
            <button type="button" class="char-option" data-pokemon="squirtle">
              <canvas class="char-head" width="20" height="20"></canvas>
              <span>Squirtle</span>
            </button>
          </div>
        </div>
        
        <div class="diff-selector">
          <div class="diff-options">
            <button type="button" class="diff-option" data-diff="easy">
              <svg class="diff-icon" viewBox="0 0 24 24" width="20" height="20" style="margin-bottom: 4px;">
                <path d="M12 2C8.69 2 6 6.03 6 11c0 4.97 2.69 9 6 9s6-4.03 6-9c0-4.97-2.69-9-6-9zm-1 11c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z" fill="#2ecc71"/>
              </svg>
              <span class="diff-name">Młody Trener</span>
              <span class="diff-desc">4 serca · 1.0x</span>
            </button>
            <button type="button" class="diff-option active" data-diff="normal">
              <svg class="diff-icon" viewBox="0 0 24 24" width="20" height="20" style="margin-bottom: 4px;">
                <circle cx="12" cy="12" r="10" fill="none" stroke="#3498db" stroke-width="2"/>
                <path d="M2 12h20" stroke="#3498db" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" fill="#fff" stroke="#3498db" stroke-width="2"/>
              </svg>
              <span class="diff-name">Trener</span>
              <span class="diff-desc">3 serca · 1.5x</span>
            </button>
            <button type="button" class="diff-option" data-diff="hard">
              <svg class="diff-icon" viewBox="0 0 24 24" width="20" height="20" style="margin-bottom: 4px;">
                <path d="M12 2L15 8L21 9L16.5 14L18 20L12 17L6 20L7.5 14L3 9L9 8L12 2Z" fill="#e74c3c"/>
              </svg>
              <span class="diff-name">Mistrz</span>
              <span class="diff-desc">2 serca · 2.5x</span>
            </button>
          </div>
        </div>
        
        <button id="start" type="button">Start Game</button>

      </div>
    </div>
    
    <div id="leaderboard">
      <h3>Top 100 Ranking</h3>
      <div id="podiumContainer" class="hidden">
        <div class="podium-step step-second" id="podiumStep2">
          <div class="podium-char"><canvas id="podiumCanvas2" width="20" height="20"></canvas></div>
          <div class="podium-user" id="podiumUser2">---</div>
          <div class="podium-score" id="podiumScore2">---</div>
          <div class="podium-block">2</div>
        </div>
        <div class="podium-step step-first" id="podiumStep1">
          <div class="podium-char"><canvas id="podiumCanvas1" width="20" height="20"></canvas></div>
          <div class="podium-user" id="podiumUser1">---</div>
          <div class="podium-score" id="podiumScore1">---</div>
          <div class="podium-block">1</div>
        </div>
        <div class="podium-step step-third" id="podiumStep3">
          <div class="podium-char"><canvas id="podiumCanvas3" width="20" height="20"></canvas></div>
          <div class="podium-user" id="podiumUser3">---</div>
          <div class="podium-score" id="podiumScore3">---</div>
          <div class="podium-block">3</div>
        </div>
      </div>
      <ul id="leaderboardList">
        <li>Wczytywanie...</li>
      </ul>
    </div>
    
    <div class="bar hidden" id="statusBar">
      <span class="stat"><span id="form">Pikachu</span></span>
      <span class="stat">Score: <span id="score">0</span></span>
      <span class="stat" id="gemStat" title="Diamenty">
        <span class="slots" id="gemSlots"></span>
      </span>
      <span class="stat" id="heartStat" title="Serca">
        <span class="slots" id="heartSlots"></span>
      </span>
      <button class="stat hidden" id="abilityStat" title="Użyj zdolności specjalnej (Spacja / Kliknij)" style="cursor: pointer; background: #d35400; border: 1px solid #e67e22; color: #fff; font-weight: bold; border-radius: 4px; transition: background 0.2s;">
        <span id="abilityName">Ogień</span>: <span id="abilityCharges">3</span>
      </button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
