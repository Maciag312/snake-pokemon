<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1a1520;
      color: #eee;
      font: 14px monospace;
    }
    #wrap {
      position: relative;
      padding: 16px;
      background: linear-gradient(180deg, #c4a574 0%, #a67c52 40%, #8b6340 100%);
      box-shadow:
        inset 0 0 0 3px #5c3d28,
        inset 0 0 0 7px #d4b896,
        inset 0 0 0 10px #7a5235,
        0 10px 28px rgba(0, 0, 0, 0.45);
      border-radius: 4px;
    }
    #wrap::before,
    #wrap::after,
    .post-bl,
    .post-br {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      background: radial-gradient(circle at 35% 35%, #e8d5b5, #8b6340 60%, #5c3d28);
      border: 2px solid #3d2818;
      border-radius: 3px;
      z-index: 2;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    #wrap::before { top: 5px; left: 5px; }
    #wrap::after { top: 5px; right: 5px; }
    .post-bl { bottom: 5px; left: 5px; }
    .post-br { bottom: 5px; right: 5px; }
    canvas {
      background: #2a2438;
      image-rendering: pixelated;
      display: block;
      border: 3px solid #5c3d28;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.35);
    }
    .bar {
      margin-top: 14px;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stat {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border: 1px solid #5a4a6a;
      border-radius: 4px;
    }
    .slots {
      display: inline-flex;
      gap: 4px;
    }
    .slot {
      width: 22px;
      height: 22px;
      opacity: 0.28;
      filter: grayscale(1);
      transition: opacity 0.2s, filter 0.2s, transform 0.2s;
    }
    .slot.on {
      opacity: 1;
      filter: none;
    }
    .slot.pop {
      animation: pop 0.35s ease;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    #menu {
      position: absolute;
      inset: 16px;
      display: grid;
      place-items: center;
      background: rgba(20, 16, 28, 0.9);
      text-align: center;
      gap: 12px;
      z-index: 3;
    }
    #menu.hidden { display: none; }
    select, button {
      background: #2a2438;
      color: #eee;
      border: 1px solid #5a4a6a;
      font: inherit;
      padding: 6px 10px;
    }
    button { cursor: pointer; }
    button:hover { background: #3a3450; }
    #hint { opacity: 0.7; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div>
    <div id="wrap">
      <span class="post-bl"></span>
      <span class="post-br"></span>
      <canvas id="game" width="800" height="500"></canvas>
      <div id="menu">
        <div>
          <p style="margin-bottom:8px">Wybierz Pokemona</p>
          <select id="pokemon">
            <option value="pikachu">Pikachu → Raichu</option>
            <option value="bulbasaur">Bulbasaur → Ivysaur → Venusaur</option>
            <option value="charmander">Charmander → Charmeleon → Charizard</option>
            <option value="squirtle">Squirtle → Wartortle → Blastoise</option>
          </select>
          <p id="hint">Max 3◆ / 3♥ · naciśnij H = serce za 3◆ · ewolucja 5 / 12</p>
        </div>
        <button id="start" type="button">Start</button>
      </div>
    </div>
    <div class="bar">
      <span class="stat"><span id="form">Pikachu</span></span>
      <span class="stat">Score: <span id="score">0</span></span>
      <span class="stat" id="gemStat" title="Diamenty">
        <span class="slots" id="gemSlots"></span>
      </span>
      <span class="stat" id="heartStat" title="Serca">
        <span class="slots" id="heartSlots"></span>
      </span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
