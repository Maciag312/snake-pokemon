<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Snake Pokemon</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      /* Zmiana tła na bardziej kosmiczne/gwiezdne */
      background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 70%, #050509 100%);
      color: #eee;
      font: 14px monospace;
      padding: 8px;
      transition: background 0.4s ease;
    }
    .page {
      width: min(100%, 832px);
      max-width: 100%;
    }
    #wrap {
      position: relative;
      width: 100%;
      padding: clamp(8px, 2vw, 16px);
      /* Usunięcie starego obramowania i gradientu, dodanie półprzezroczystości */
      background: rgba(20, 16, 28, 0.6);
      box-shadow:
        0 0 40px rgba(120, 80, 180, 0.1),
        0 10px 28px rgba(0, 0, 0, 0.45);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }
    /* Usunięcie zbędnych pseudoelementów */
    #wrap::before,
    #wrap::after {
      display: none;
    }
    canvas {
      /* Tło canvasu na głęboką czerń */
      background: #000;
      image-rendering: pixelated;
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      /* Usunięcie starej ramki CSS */
      border: none;
      border-radius: 4px;
    }
    .bar {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }
    .stat {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 10px;
      border: 1px solid #5a4a6a;
      border-radius: 4px;
    }
    .slots {
      display: inline-flex;
      gap: 4px;
    }
    .slot {
      width: 22px;
      height: 22px;
      opacity: 0.28;
      filter: grayscale(1);
      transition: opacity 0.2s, filter 0.2s, transform 0.2s;
    }
    .slot.on {
      opacity: 1;
      filter: none;
    }
    .slot.pop {
      animation: pop 0.35s ease;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    #menu {
      position: absolute;
      /* Dostosowanie pozycji menu do usuniętej ramki CSS */
      inset: clamp(8px, 2vw, 16px);
      display: grid;
      place-items: center;
      background: rgba(10, 8, 14, 0.95);
      text-align: center;
      gap: 12px;
      z-index: 3;
      padding: 12px;
      border-radius: 8px;
    }
    #menu.hidden { display: none; }
    select, button {
      background: #2a2438;
      color: #eee;
      border: 1px solid #5a4a6a;
      font: inherit;
      padding: 6px 10px;
      max-width: 100%;
    }
    button { cursor: pointer; }
    button:hover { background: #3a3450; }
    #hint { opacity: 0.7; font-size: 12px; margin-top: 6px; max-width: 28ch; margin-inline: auto; }
  </style>
</head>
<body>
  <div class="page">
    <div id="wrap">
      <canvas id="game" width="800" height="500"></canvas>
      <div id="menu">
        <div>
          <p style="margin-bottom:8px">Wybierz Pokemona</p>
          <select id="pokemon">
            <option value="pikachu">Pikachu → Raichu</option>
            <option value="bulbasaur">Bulbasaur → Ivysaur → Venusaur</option>
            <option value="charmander">Charmander → Charmeleon → Charizard</option>
            <option value="squirtle">Squirtle → Wartortle → Blastoise</option>
          </select>
          <p id="hint">Swipe / strzałki · H = serce · ewolucja 5 / 12</p>
        </div>
        <button id="start" type="button">Start</button>
      </div>
    </div>
    <div class="bar">
      <span class="stat"><span id="form">Pikachu</span></span>
      <span class="stat">Score: <span id="score">0</span></span>
      <span class="stat" id="gemStat" title="Diamenty">
        <span class="slots" id="gemSlots"></span>
      </span>
      <span class="stat" id="heartStat" title="Serca">
        <span class="slots" id="heartSlots"></span>
      </span>
      <button id="buyHeart" type="button" class="stat" title="Kup serce">♥ kup</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
